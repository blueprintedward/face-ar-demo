<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Face01 AR — iOS</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root { --accent: #2f6dff; }
    html, body { height: 100%; margin: 0; background: #0b0b0b; }
    model-viewer {
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at 50% 28%, #1a1a24, #0b0b0b 70%);
    }
    .badge {
      position: fixed; top: 14px; left: 14px; z-index: 2;
      background: rgba(47,109,255,.92); color: #fff;
      padding: 8px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="badge">iOS · USDZ AR</div>
  <model-viewer
    src="face01-ar-03.glb?v=face01-space"
    ios-src="face01-ar-03.usdz?v=face01-space"
    poster="thumb.jpg?v=face01-space"
    alt="Face01 AR"
    ar
    ar-modes="quick-look"
    ar-scale="auto"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1"
    exposure="1"
  >
    <button slot="ar-button" style="
      position:absolute; left:50%; transform:translateX(-50%); bottom:72px;
      appearance:none; border:0; border-radius:14px; padding:14px 28px;
      font-size:16px; font-weight:700; color:#fff; background:var(--accent); cursor:pointer;">
      開啟 AR
    </button>
  </model-viewer>
</body>
</html>
