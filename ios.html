<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Face Blue Out — iOS AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root { --bg: #0b0b0b; --fg: #f3f3f3; --accent: #2f6dff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--fg);
      font-family: "SF Pro Text", "PingFang TC", system-ui, sans-serif; }
    model-viewer {
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at 50% 28%, #1a1a24, #0b0b0b 70%);
    }
  </style>
</head>
<body>
  <model-viewer
    src="face-blue-out-b.glb"
    ios-src="face-blue-out-b.usdz"
    poster="thumb.jpg"
    alt="Face blue out b"
    ar
    ar-modes="quick-look"
    ar-scale="auto"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1"
    exposure="1"
  >
    <button slot="ar-button" style="
      position:absolute; left:50%; transform:translateX(-50%); bottom:72px;
      appearance:none; border:0; border-radius:14px; padding:14px 28px;
      font-size:16px; font-weight:700; color:#fff; background:var(--accent); cursor:pointer;">
      開啟 AR
    </button>
  </model-viewer>
</body>
</html>
