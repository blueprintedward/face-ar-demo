<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Face Blue Out — Android 面部 AR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #video {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
    }
    #canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    #badge {
      position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px;
      background: rgba(47,109,255,.9); color: #fff; font-size: 12px; font-weight: 700;
      padding: 8px 12px; border-radius: 999px; z-index: 2;
    }
    #ui {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      background: linear-gradient(transparent, rgba(0,0,0,.8));
    }
    #start {
      appearance: none; border: 0; border-radius: 14px;
      padding: 14px 28px; font-size: 16px; font-weight: 700;
      color: #fff; background: #2f6dff; cursor: pointer;
    }
    #status { color: #fff; font-size: 13px; opacity: .9; text-align: center; max-width: 320px; line-height: 1.4; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="badge">Android · 面部定位</div>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <p id="status">前置鏡頭 + 臉部追蹤（不是空間 AR）</p>
    <button id="start">允許鏡頭並開始</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { FaceLandmarker, FilesetResolver } from "@mediapipe/tasks-vision";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const startBtn = document.getElementById("start");
    const statusEl = document.getElementById("status");

    let config = {
      modelUrl: "face-blue-out-b.glb",
      scaleMultiplier: 3.2,
      offsetX: 0,
      offsetY: 0.05,
      offsetZ: 0,
      rotationXDeg: -90,
      rotationYDeg: 180,
      rotationZDeg: 0,
    };

    try {
      const res = await fetch("face-config.json");
      if (res.ok) config = { ...config, ...(await res.json()) };
    } catch (_) {}

    let faceLandmarker;
    let renderer, scene, camera, faceGroup;
    let running = false;
    let lastVideoTime = -1;

    async function initFaceLandmarker() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      async function create(delegate) {
        return FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate,
          },
          runningMode: "VIDEO",
          numFaces: 1,
          outputFacialTransformationMatrixes: true,
        });
      }

      try {
        return await create("GPU");
      } catch (_) {
        return create("CPU");
      }
    }

    async function initThree() {
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      resize();

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
      camera.position.z = 2.2;

      scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.3));
      const dir = new THREE.DirectionalLight(0xffffff, 0.9);
      dir.position.set(0, 1, 2);
      scene.add(dir);

      faceGroup = new THREE.Group();
      scene.add(faceGroup);

      const gltf = await new Promise((resolve, reject) => {
        new GLTFLoader().load(config.modelUrl, resolve, undefined, reject);
      });

      const model = gltf.scene;
      model.rotation.set(
        THREE.MathUtils.degToRad(config.rotationXDeg),
        THREE.MathUtils.degToRad(config.rotationYDeg),
        THREE.MathUtils.degToRad(config.rotationZDeg)
      );
      faceGroup.add(model);
    }

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (renderer) {
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
    }

    window.addEventListener("resize", resize);

    function applyFaceTransform(landmarks, matrices) {
      if (!landmarks?.length) {
        faceGroup.visible = false;
        return;
      }
      faceGroup.visible = true;

      const lm = landmarks[0];
      const leftEye = lm[33];
      const rightEye = lm[263];
      const forehead = lm[10];
      const chin = lm[152];

      const cx = (leftEye.x + rightEye.x) * 0.5;
      const cy = (leftEye.y + rightEye.y) * 0.5;
      const eyeDist = Math.hypot(rightEye.x - leftEye.x, rightEye.y - leftEye.y);
      const faceH = Math.abs(forehead.y - chin.y);

      const x = -(cx - 0.5) * 2;
      const y = -(cy - 0.5) * 2 - faceH * 0.35;
      const scale = eyeDist * config.scaleMultiplier;

      faceGroup.position.set(
        x + config.offsetX,
        y + config.offsetY,
        config.offsetZ
      );
      faceGroup.scale.setScalar(scale);

      if (matrices?.length) {
        const data = matrices[0].data || matrices[0];
        const m = new THREE.Matrix4().fromArray(Array.from(data));
        const quat = new THREE.Quaternion();
        m.decompose(new THREE.Vector3(), quat, new THREE.Vector3());
        faceGroup.quaternion.copy(quat);
        faceGroup.quaternion.x *= -1;
        faceGroup.quaternion.z *= -1;
      } else {
        const roll = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
        faceGroup.rotation.z = -roll;
      }
    }

    function loop() {
      if (!running) return;
      requestAnimationFrame(loop);

      if (video.readyState >= 2 && faceLandmarker && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const result = faceLandmarker.detectForVideo(video, performance.now());
        applyFaceTransform(result.faceLandmarks, result.facialTransformationMatrixes);
      }
      renderer.render(scene, camera);
    }

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      statusEl.textContent = "載入面部追蹤…";
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();

        faceLandmarker = await initFaceLandmarker();
        await initThree();

        startBtn.classList.add("hidden");
        statusEl.textContent = "面部定位中 · 請對準前置鏡頭";
        running = true;
        loop();
      } catch (err) {
        statusEl.textContent = "面部模式載入失敗：" + err.message;
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
