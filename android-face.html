<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Face Blue Out — Android 面部 AR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #wrap { position: fixed; inset: 0; }
    #video {
      width: 100%; height: 100%; object-fit: cover;
      transform: scaleX(-1);
    }
    #canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    #badge {
      position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; z-index: 3;
      background: rgba(47,109,255,.92); color: #fff; font-size: 12px; font-weight: 700;
      padding: 8px 12px; border-radius: 999px;
    }
    #ui {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      background: linear-gradient(transparent, rgba(0,0,0,.85));
    }
    #start {
      appearance: none; border: 0; border-radius: 14px;
      padding: 14px 28px; font-size: 16px; font-weight: 700;
      color: #fff; background: #2f6dff; cursor: pointer;
    }
    #status { color: #fff; font-size: 13px; text-align: center; max-width: 340px; line-height: 1.45; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="badge">Android · 面部定位</div>
  <div id="wrap">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="ui">
    <p id="status">前置鏡頭 + 臉部追蹤（不是空間 AR）</p>
    <button id="start">允許鏡頭並開始</button>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const startBtn = document.getElementById("start");
    const statusEl = document.getElementById("status");

    let config = {
      modelUrl: "face-blue-out-b.glb",
      scaleMultiplier: 1.35,
      offsetX: 0,
      offsetY: 0.08,
      offsetZ: 0,
      rotationXDeg: 0,
      rotationYDeg: 0,
      rotationZDeg: 0,
    };

    try {
      const res = await fetch("face-config.json");
      if (res.ok) config = { ...config, ...(await res.json()) };
    } catch (_) {}

    let faceLandmarker, renderer, scene, camera, faceAnchor, modelRoot;
    let running = false;
    let lastVideoTime = -1;
    let facesDetected = 0;

    function setStatus(msg) { statusEl.textContent = msg; }

    function normalizeModel(model) {
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      model.position.sub(center);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      model.scale.multiplyScalar(1 / maxDim);
    }

    async function initFaceLandmarker() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      for (const delegate of ["GPU", "CPU"]) {
        try {
          return await FaceLandmarker.createFromOptions(vision, {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
              delegate,
            },
            runningMode: "VIDEO",
            numFaces: 1,
            outputFacialTransformationMatrixes: true,
          });
        } catch (_) {}
      }
      throw new Error("MediaPipe 無法啟動");
    }

    async function initThree() {
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, premultipliedAlpha: true });
      renderer.setClearColor(0x000000, 0);

      scene = new THREE.Scene();
      // 正交相機 = 畫面座標，模型才能貼在臉上
      camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 10);
      camera.position.z = 2;

      // 必須先有 camera 再 resize（否則會 Cannot set properties of undefined）
      resize();

      scene.add(new THREE.AmbientLight(0xffffff, 1.1));
      const key = new THREE.DirectionalLight(0xffffff, 0.9);
      key.position.set(0, 1, 2);
      scene.add(key);

      faceAnchor = new THREE.Group();
      scene.add(faceAnchor);

      modelRoot = new THREE.Group();
      faceAnchor.add(modelRoot);

      const gltf = await new Promise((resolve, reject) => {
        new GLTFLoader().load(config.modelUrl, resolve, undefined, reject);
      });

      const model = gltf.scene;
      normalizeModel(model);
      model.rotation.set(
        THREE.MathUtils.degToRad(config.rotationXDeg),
        THREE.MathUtils.degToRad(config.rotationYDeg),
        THREE.MathUtils.degToRad(config.rotationZDeg)
      );
      modelRoot.add(model);
    }

    function resize() {
      if (!renderer || !camera) return;
      const w = window.innerWidth || 1;
      const h = window.innerHeight || 1;
      renderer.setSize(w, h, false);
      const aspect = w / h;
      if (aspect >= 1) {
        camera.left = -aspect;
        camera.right = aspect;
        camera.top = 1;
        camera.bottom = -1;
      } else {
        camera.left = -1;
        camera.right = 1;
        camera.top = 1 / aspect;
        camera.bottom = -1 / aspect;
      }
      camera.updateProjectionMatrix();
    }

    window.addEventListener("resize", resize);

    // 臉部 landmark (0~1) → 螢幕座標（前置鏡頭已 mirror）
    function lmToScreen(lm) {
      const aspect = window.innerWidth / window.innerHeight;
      let x = (0.5 - lm.x) * 2; // mirror
      let y = -(lm.y - 0.5) * 2;
      if (aspect >= 1) x *= aspect;
      else y *= (1 / aspect);
      return { x, y };
    }

    function applyFaceTransform(landmarks, matrices) {
      if (!landmarks?.length) {
        faceAnchor.visible = false;
        facesDetected = 0;
        return;
      }
      facesDetected = 1;
      faceAnchor.visible = true;

      const lm = landmarks[0];
      const leftEye = lm[33];
      const rightEye = lm[263];
      const nose = lm[1];
      const forehead = lm[10];
      const chin = lm[152];

      const midEye = lmToScreen({
        x: (leftEye.x + rightEye.x) / 2,
        y: (leftEye.y + rightEye.y) / 2,
      });
      const nosePt = lmToScreen(nose);

      const eyeDist = Math.hypot(rightEye.x - leftEye.x, rightEye.y - leftEye.y);
      const faceH = Math.abs(forehead.y - chin.y);
      const aspect = window.innerWidth / window.innerHeight;

      // 以雙眼距離 + 臉高決定大小
      let scale = eyeDist * config.scaleMultiplier * (aspect >= 1 ? aspect : 1);
      scale = Math.max(scale, faceH * config.scaleMultiplier * 0.9);

      faceAnchor.position.set(
        midEye.x + config.offsetX,
        midEye.y + config.offsetY - faceH * (aspect >= 1 ? aspect : 1) * 0.12,
        config.offsetZ
      );
      faceAnchor.scale.setScalar(scale);

      faceAnchor.rotation.set(0, 0, 0);
      if (matrices?.length) {
        const raw = matrices[0].data || matrices[0];
        const arr = Array.from(raw);
        const m = new THREE.Matrix4().fromArray(arr);
        const quat = new THREE.Quaternion();
        m.decompose(new THREE.Vector3(), quat, new THREE.Vector3());
        faceAnchor.quaternion.copy(quat);
        // 前置鏡頭鏡像 + 螢幕座標修正
        faceAnchor.quaternion.y *= -1;
        faceAnchor.quaternion.w *= -1;
      } else {
        const roll = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
        faceAnchor.rotation.z = roll;
      }

      // 若模型仍偏，用鼻尖微調
      faceAnchor.position.x += (nosePt.x - midEye.x) * 0.15;
      faceAnchor.position.y += (nosePt.y - midEye.y) * 0.15;
    }

    function loop() {
      if (!running) return;
      requestAnimationFrame(loop);

      if (video.readyState >= 2 && faceLandmarker && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const result = faceLandmarker.detectForVideo(video, performance.now());
        applyFaceTransform(result.faceLandmarks, result.facialTransformationMatrixes);
        if (facesDetected) {
          setStatus("面部定位中 · 模型應貼在臉上");
        } else {
          setStatus("請把臉對準前置鏡頭");
        }
      }
      renderer.render(scene, camera);
    }

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      setStatus("載入鏡頭與模型…");
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();

        faceLandmarker = await initFaceLandmarker();
        await initThree();

        startBtn.classList.add("hidden");
        running = true;
        loop();
      } catch (err) {
        setStatus("失敗：" + err.message + " · 請用 Chrome 開啟");
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
