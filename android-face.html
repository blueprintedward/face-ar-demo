<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Face Blue Out — Android 面部 AR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #video {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
    }
    #canvas {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    #ui {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 16px 20px calc(16px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      background: linear-gradient(transparent, rgba(0,0,0,.75));
    }
    #start {
      appearance: none; border: 0; border-radius: 14px;
      padding: 14px 28px; font-size: 16px; font-weight: 700;
      color: #fff; background: #2f6dff; cursor: pointer;
    }
    #status { color: #fff; font-size: 13px; opacity: .85; text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <p id="status">Android 面部定位模式 · 使用前置鏡頭</p>
    <button id="start">允許鏡頭並開始</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const startBtn = document.getElementById("start");
    const statusEl = document.getElementById("status");

    let config = {
      modelUrl: "face-blue-out-b.glb",
      scaleMultiplier: 2.8,
      offsetX: 0,
      offsetY: 0.02,
      offsetZ: 0.15,
      rotationXDeg: -90,
      rotationYDeg: 180,
      rotationZDeg: 0,
    };

    try {
      const res = await fetch("face-config.json");
      if (res.ok) config = { ...config, ...(await res.json()) };
    } catch (_) {}

    let faceLandmarker;
    let renderer, scene, camera, faceGroup, model;
    let running = false;

    async function initFaceLandmarker() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU",
        },
        runningMode: "VIDEO",
        numFaces: 1,
        outputFaceBlendshapes: false,
        outputFacialTransformationMatrixes: true,
      });
    }

    async function initThree() {
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      resize();

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
      camera.position.z = 2.5;

      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(light);
      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(0, 1, 2);
      scene.add(dir);

      faceGroup = new THREE.Group();
      scene.add(faceGroup);

      const loader = new GLTFLoader();
      await new Promise((resolve, reject) => {
        loader.load(config.modelUrl, (gltf) => {
          model = gltf.scene;
          model.rotation.set(
            THREE.MathUtils.degToRad(config.rotationXDeg),
            THREE.MathUtils.degToRad(config.rotationYDeg),
            THREE.MathUtils.degToRad(config.rotationZDeg)
          );
          faceGroup.add(model);
          resolve();
        }, undefined, reject);
      });
    }

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (renderer) {
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
    }

    window.addEventListener("resize", resize);

    function applyFaceTransform(landmarks, matrix) {
      if (!landmarks?.length) {
        faceGroup.visible = false;
        return;
      }
      faceGroup.visible = true;

      const lm = landmarks[0];
      const nose = lm[1];
      const leftEye = lm[33];
      const rightEye = lm[263];
      const forehead = lm[10];

      const cx = (leftEye.x + rightEye.x) * 0.5;
      const cy = (leftEye.y + rightEye.y) * 0.5;
      const eyeDist = Math.hypot(rightEye.x - leftEye.x, rightEye.y - leftEye.y);

      // 鏡頭已 mirror，x 要反轉對齊畫面
      const x = -(cx - 0.5) * 2;
      const y = -(cy - 0.5) * 2;
      const z = 0;

      const scale = eyeDist * config.scaleMultiplier;
      faceGroup.position.set(
        x + config.offsetX,
        y + config.offsetY,
        z + config.offsetZ
      );
      faceGroup.scale.setScalar(scale);

      if (matrix?.length) {
        const m = new THREE.Matrix4().fromArray(matrix[0].data);
        const pos = new THREE.Vector3();
        const quat = new THREE.Quaternion();
        const scl = new THREE.Vector3();
        m.decompose(pos, quat, scl);
        faceGroup.quaternion.copy(quat);
        // 前置鏡頭鏡像修正
        faceGroup.quaternion.y *= -1;
        faceGroup.quaternion.w *= -1;
      } else {
        const roll = Math.atan2(rightEye.y - leftEye.y, rightEye.x - leftEye.x);
        faceGroup.rotation.z = -roll;
      }

      // 微調：模型中心對準臉部
      const faceHeight = Math.abs(forehead.y - lm[152].y);
      faceGroup.position.y += -faceHeight * 0.15;
    }

    function loop() {
      if (!running) return;
      requestAnimationFrame(loop);

      if (video.readyState >= 2 && faceLandmarker) {
        const result = faceLandmarker.detectForVideo(video, performance.now());
        applyFaceTransform(
          result.faceLandmarks,
          result.facialTransformationMatrixes
        );
      }
      renderer.render(scene, camera);
    }

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      statusEl.textContent = "載入面部追蹤…";
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false,
        });
        video.srcObject = stream;
        await video.play();

        await initFaceLandmarker();
        await initThree();

        startBtn.classList.add("hidden");
        statusEl.textContent = "面部定位中 · 移動頭部測試對位";
        running = true;
        loop();
      } catch (err) {
        statusEl.textContent = "失敗：" + err.message;
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
