<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Grassland Small — Android AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #0b0b0b; }
    model-viewer { width: 100%; height: 100%; background: radial-gradient(ellipse at 50% 28%, #1a1a24, #0b0b0b 70%); }
  </style>
</head>
<body>
  <model-viewer
    src="grassland-small.glb?v=grassland3"
    poster="thumb.jpg?v=grassland3"
    alt="Grassland Small"
    ar
    ar-modes="webxr scene-viewer"
    ar-scale="auto"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1"
    exposure="1"
  >
    <button slot="ar-button" style="position:absolute; left:50%; transform:translateX(-50%); bottom:72px; appearance:none; border:0; border-radius:14px; padding:14px 28px; font-size:16px; font-weight:700; color:#fff; background:#2f6dff; cursor:pointer;">
      開啟 AR
    </button>
  </model-viewer>
</body>
</html>
