<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Face Blue Out — AR</title>
  <script>
    (function () {
      var ua = navigator.userAgent;
      if (/Android/i.test(ua)) {
        location.replace("android-face.html");
        return;
      }
      if (/iPhone|iPad|iPod/i.test(ua)) {
        location.replace("ios.html");
        return;
      }
    })();
  </script>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0b0b0b; color: #f3f3f3; font-family: system-ui, sans-serif;
      text-align: center; padding: 24px;
    }
    a {
      display: inline-block; margin: 8px; padding: 14px 22px;
      border-radius: 12px; background: #2f6dff; color: #fff;
      text-decoration: none; font-weight: 700;
    }
    p { opacity: .7; max-width: 420px; line-height: 1.5; }
  </style>
</head>
<body>
  <div>
    <h1>Face Blue Out AR</h1>
    <p>用手機掃 QR 會自動分流。桌面請選平台：</p>
    <a href="ios.html">iOS（Quick Look）</a>
    <a href="android-face.html">Android（面部定位）</a>
  </div>
</body>
</html>
