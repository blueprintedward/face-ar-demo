<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Face01 AR — 面部投影</title>
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      if (/Android/i.test(ua)) {
        location.replace("android-face.html?v=face01");
        return;
      }
      if (/iPhone|iPad|iPod/i.test(ua)) {
        location.replace("ios.html?v=face01");
        return;
      }
    })();
  </script>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0b0b0b; color: #f3f3f3; font-family: system-ui, sans-serif;
      text-align: center; padding: 24px;
    }
    a {
      display: inline-block; margin: 8px; padding: 14px 22px;
      border-radius: 12px; background: #2f6dff; color: #fff;
      text-decoration: none; font-weight: 700;
    }
    p { opacity: .7; max-width: 420px; line-height: 1.5; }
    img.qr { width: 180px; height: 180px; background: #fff; border-radius: 8px; margin-top: 16px; }
  </style>
</head>
<body>
  <div>
    <h1>Face01 AR</h1>
    <p>同一個 QR：iPhone 用 USDZ，Android 用前置鏡頭面部追蹤。</p>
    <a href="ios.html?v=face01">iOS（Quick Look）</a>
    <a href="android-face.html?v=face01">Android（面部定位）</a>
    <div>
      <img class="qr" id="qr" alt="QR" />
    </div>
  </div>
  <script>
    var url = location.href.split("?")[0].split("#")[0];
    document.getElementById("qr").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=" + encodeURIComponent(url);
  </script>
</body>
</html>
